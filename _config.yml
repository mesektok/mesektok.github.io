theme: jekyll-theme-chirpy

title: damesektok — 교수의 애드센스 도전기
tagline: "은퇴 교수의 Git·AI·애드센스 도전기"
description: >-
  35년 교수직 은퇴 후 Git도 몰랐던 교수가
  GitHub Pages, Notion, AI로 블로그를 만들고
  애드센스에 도전하는 과정을 날것 그대로 기록합니다.
    
lang: ko-KR

url: "https://damesek.com"
baseurl: ""

lang: ko
timezone: Asia/Seoul

author:
  name: mesektok
  bio: 35년 교수직 은퇴 후 블로그로 새 출발 중입니다.
  location: South Korea

github:
  username: "mesektok"
x:
  username: "@EnfpguruD"

social:
  name: "prof Damesek"
  email: "enfpguru@gmail.com"
  links:
    - "https://twitter.com/@EnfpguruD"
    - "https://github.com/mesektok"

webmaster_verifications:
  google: lWSgOsFTkT0P4k6DX2H8tYGe0PrSIb87wwM-YtMUxPM

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

sass:
  style: compressed

toc: true
paginate: 10

cdn: "https://chirpy-img.netlify.app"
avatar: "/commons/avatar.jpg"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - "package*.json"

timezone: Asia/Seoul  

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: "/tags/:name/"
    category: "/categories/:name/"
